<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash v0.1</title>
    <!-- Fonte geométrica estilo Geometry Dash -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Canvas do Jogo (Fundo e Fase) -->
        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <!-- TELA INICIAL (MENU) -->
        <div id="main-menu" class="overlay">
            <div class="logo-container">
                <h1 class="gd-title">GEOMETRY<br><span>DASH</span></h1>
                <div class="version-badge">v0.1</div>
            </div>

            <button id="play-btn" aria-label="Jogar">
                <div class="play-triangle"></div>
            </button>
        </div>

        <!-- TELA DE VITÓRIA (LEVEL COMPLETE) -->
        <div id="win-screen" class="overlay hidden">
            <div class="win-box">
                <h2>LEVEL COMPLETE!</h2>
                <p>Spike Run concluída</p>
                <button id="menu-btn">MENU</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
