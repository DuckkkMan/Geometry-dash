<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash v0.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <!-- BARRA DE PROGRESSO + BOTÃO PAUSE -->
        <div id="hud" class="hidden">
            <div class="progress-wrapper">
                <div class="progress-bar-bg">
                    <div id="progress-fill"></div>
                </div>
                <span id="progress-text">0%</span>
            </div>
            <button id="pause-menu-btn" type="button" aria-label="Pausar" title="Pausar">II</button>
        </div>

        <!-- MENU DE PAUSE -->
        <div id="pause-screen" class="overlay hidden">
            <div class="win-box">
                <h2>PAUSED</h2>
                <p id="pause-level-name">Spike Rush</p>
                <div class="win-buttons">
                    <button id="resume-btn" type="button" class="gd-btn green">▶</button>
                    <button id="pause-restart-btn" type="button" class="gd-btn yellow">↻</button>
                    <button id="pause-exit-menu-btn" type="button" class="gd-btn blue">MENU</button>
                </div>
            </div>
        </div>

        <!-- TELA INICIAL (MENU PRINCIPAL) -->
        <div id="main-menu" class="overlay">
            <div class="logo-container">
                <h1 class="gd-title">GEOMETRY<br><span>DASH</span></h1>
                <div class="version-badge">v0.3</div>
            </div>

            <div class="menu-buttons-row">
                <button id="skin-btn" type="button" class="side-btn" aria-label="Skins" title="Skins">
                    <canvas id="skin-btn-icon" width="44" height="44"></canvas>
                </button>

                <button id="play-btn" type="button" aria-label="Jogar" title="Jogar">
                    <div class="play-triangle"></div>
                </button>
            </div>
        </div>

        <!-- SELEÇÃO DE FASES -->
        <div id="level-select" class="overlay hidden">
            <button id="back-from-levels" type="button" class="corner-back-btn">←</button>
            
            <div class="level-carousel">
                <button id="prev-level" type="button" class="arrow-btn">‹</button>
                
                <div id="level-card" class="level-card">
                    <div class="level-header">
                        <div class="difficulty-face" id="level-diff-face"></div>
                        <div class="level-title-group">
                            <h2 id="level-name">Spike Rush</h2>
                            <div class="level-stats">
                                <span id="level-diff-text">EASY • RECORDE: 0% • ATT: 0</span>
                                <span id="level-stars">☆ 1</span>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="next-level" type="button" class="arrow-btn">›</button>
            </div>
            <p class="hint-text">Toque ou clique no cartão da fase para iniciar</p>
        </div>

        <!-- GARAGEM DE SKINS -->
        <div id="skin-garage" class="overlay hidden">
            <button id="back-from-skins" type="button" class="corner-back-btn">←</button>
            
            <div class="garage-box">
                <h2>ICON KIT</h2>
                
                <div class="preview-stage">
                    <canvas id="skin-preview" width="80" height="80"></canvas>
                </div>

                <div class="skin-row" id="skin-models"></div>

                <div class="color-section">
                    <span>COR 1</span>
                    <div class="color-row" id="primary-colors"></div>
                </div>

                <div class="color-section">
                    <span>COR 2</span>
                    <div class="color-row" id="secondary-colors"></div>
                </div>
            </div>
        </div>

        <!-- TELA DE VITÓRIA (LEVEL COMPLETE) -->
        <div id="win-screen" class="overlay hidden">
            <div class="win-box">
                <h2>LEVEL COMPLETE!</h2>
                <p id="win-level-name">Spike Rush • 100%</p>
                <div class="win-buttons">
                    <button id="replay-btn" type="button" class="gd-btn green">↻</button>
                    <button id="win-menu-btn" type="button" class="gd-btn blue">MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
